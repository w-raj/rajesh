<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>API Request Demo</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="mb-4">Enter Serial Number</h2>
    <div class="mb-3">
      <input
        type="text"
        id="inputText"
        class="form-control"
        placeholder="Type here.."
      />
    </div>
    <button class="btn btn-primary" onclick="sendRequest()">Find Cert</button>

    <div class="mt-4">
      <h5>Response:</h5>
      <pre id="responseBox" class="bg-white p-3 border rounded"></pre>
    </div>
  </div>

  <script>
    function sendRequest() {
      const userInput = document.getElementById("inputText").value;

      fetch("https://example.com/api/endpoint", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ query: userInput })
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById("responseBox").textContent = JSON.stringify(data, null, 2);
      })
      .catch(error => {
        document.getElementById("responseBox").textContent = "Error: " + error;
      });
    }
  </script>
</body>
</html>
